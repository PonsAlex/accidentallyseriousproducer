name: Editorial advance

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  advance-editorial-items:
    if: ${{ github.event.issue.pull_request == false && github.event.comment.body != null && trim(github.event.comment.body) == '/advance' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Advance selected editorial items
        run: node scripts/editorial-advance.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
